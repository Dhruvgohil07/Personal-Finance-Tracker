# Local development infrastructure: Postgres + Redis + the RQ worker + its scheduler.
# Start:  docker compose up -d        Stop: docker compose down
# Reset all data (deletes volumes!): docker compose down -v
# After changing backend code, rebuild:  docker compose up -d --build worker scheduler
#
# The API runs outside Docker (`uv run uvicorn ...`). The worker runs inside
# it because RQ needs fork(), which Windows doesn't have.

name: kharcha

services:
  postgres:
    image: postgres:16
    environment:
      # Local-only credentials. Real deployments use Neon with secrets from env.
      POSTGRES_USER: kharcha
      POSTGRES_PASSWORD: kharcha
      POSTGRES_DB: kharcha
    ports:
      # Bind to 127.0.0.1 so the database is not reachable from your network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts here run ONCE, when the data volume is first created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kharcha -d kharcha"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    # Secrets (JWT, FILE_ENCRYPTION_KEY) come from the same .env as the API.
    # The worker MUST use the API's FILE_ENCRYPTION_KEY, or it cannot
    # decrypt the files the API stored.
    env_file: .env
    environment:
      # Inside Docker, the other services are reached by their service
      # name, not 127.0.0.1 (which would be the worker's own container).
      # These override the values from .env.
      DATABASE_URL: postgresql+psycopg://kharcha:kharcha@postgres:5432/kharcha
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Start again after a crash, or after Docker Desktop restarts.
    restart: unless-stopped

  scheduler:
    # Same image as the worker, different command: a clock that enqueues the
    # hourly cleanup job, which the worker then runs (app/workers/scheduler.py).
    # Run exactly one of these.
    build: ./backend
    command: ["python", "-m", "app.workers.scheduler"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://kharcha:kharcha@postgres:5432/kharcha
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
