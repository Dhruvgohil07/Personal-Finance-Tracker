# Alembic configuration. Run commands from the backend/ folder, e.g.
#   alembic upgrade head                              apply all migrations
#   alembic revision --autogenerate -m "add users"    draft a new migration
#   alembic check                                     fail if models and DB differ
#
# The database URL is NOT stored here: alembic/env.py reads it from
# app settings (DATABASE_URL), so there is one source of truth for it.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Split path lists using the OS separator (";" on Windows, ":" on Linux).
path_separator = os
# Files are named e.g. 2026_09_26_0001_initial_categories_merchants.py so
# they sort by date in the file explorer.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
timezone = Asia/Kolkata

[post_write_hooks]
# Run ruff on every newly generated migration so it matches our style.
# type = module runs `python -m ruff ...`, which works on Windows and Linux.
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
